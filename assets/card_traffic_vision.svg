<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 180" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180b24"/>
      <stop offset="100%" stop-color="#210f33"/>
    </linearGradient>
    <linearGradient id="glow-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  
  <rect width="400" height="180" fill="url(#bg3)"/>
  
  <!-- Subtle Grid -->
  <g stroke="#331846" stroke-width="1" opacity="0.6">
    <line x1="0" y1="45" x2="400" y2="45"/>
    <line x1="0" y1="90" x2="400" y2="90"/>
    <line x1="0" y1="135" x2="400" y2="135"/>
    <line x1="100" y1="0" x2="100" y2="180"/>
    <line x1="200" y1="0" x2="200" y2="180"/>
    <line x1="300" y1="0" x2="300" y2="180"/>
  </g>

  <!-- Left: Live Video Feed -->
  <rect x="28" y="58" width="84" height="64" rx="8" fill="#2d1344" stroke="#9333ea" stroke-width="1.5"/>
  <text x="70" y="86" fill="#f3e8ff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" text-anchor="middle">Video Feed</text>
  <text x="70" y="102" fill="#c084fc" font-family="sans-serif" font-size="8.5" text-anchor="middle">OpenCV Stream</text>

  <!-- Arrow -->
  <line x1="112" y1="90" x2="152" y2="90" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="152,87 158,90 152,93" fill="#c084fc"/>
  <text x="132" y="82" fill="#e879f9" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">frames</text>

  <!-- Middle: YOLOv8 Inference -->
  <rect x="158" y="52" width="100" height="76" rx="8" fill="#3b1759" stroke="#d946ef" stroke-width="1.5"/>
  <text x="208" y="82" fill="#fae8ff" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" text-anchor="middle">YOLOv8 Edge</text>
  <text x="208" y="98" fill="#f472b6" font-family="sans-serif" font-size="8.5" text-anchor="middle">PyTorch Neural</text>
  <text x="208" y="112" fill="#e879f9" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">mAP Optimized</text>

  <!-- Arrow -->
  <line x1="258" y1="90" x2="294" y2="90" stroke="#d946ef" stroke-width="1.5"/>
  <polygon points="294,87 300,90 294,93" fill="#d946ef"/>

  <!-- Right: Detection / Compliance -->
  <rect x="300" y="58" width="76" height="64" rx="8" fill="#2d1344" stroke="#ec4899" stroke-width="1.5"/>
  <text x="338" y="86" fill="#fce7f3" font-family="'JetBrains Mono', monospace" font-size="10.5" font-weight="bold" text-anchor="middle">Compliance</text>
  <text x="338" y="102" fill="#f472b6" font-family="sans-serif" font-size="8.5" text-anchor="middle">Helmet BBox</text>

  <!-- Badge Top Right -->
  <rect x="296" y="12" width="86" height="20" rx="4" fill="#2d1344" stroke="#701a75" stroke-width="1"/>
  <text x="339" y="25" fill="#f472b6" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">● Edge Inference</text>
</svg>
